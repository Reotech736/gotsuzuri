<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>碁つづり｜採用GTの全体確認</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#14212a;color:#eef4f6;font:15px/1.6 system-ui}header{padding:16px 24px}h1{font-size:22px;margin:0}p{margin:5px 0}main{padding:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,40%);gap:18px}button,select,a{font:inherit;color:inherit}button,select{background:#294353;border:1px solid #7a9cac;padding:7px;border-radius:5px;max-width:100%}.toolbar{padding:0 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.photo{height:70vh;background:#080e12;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}svg{width:100%;max-height:65vh;background:#d6b577;display:block}#detail{color:#ffe781}#status{color:#87e6ed}small{color:#c5d4db}a{display:inline-block;margin-right:16px}@media(max-width:850px){main{grid-template-columns:1fr}.photo{height:60vh}}
</style>
<header><h1>碁つづり｜採用GTの全体確認</h1><p>保存済みの採用GTを写真と照合します。読み取り専用・編集なし・AIの推論なし。</p><p id="status" role="status">読み込み中…</p></header>
<div class="toolbar"><button id="prev">前の写真</button><label>写真 <select id="dataset"></select></label><button id="next">次の写真</button><button id="fit">写真全体</button><button id="plus">拡大</button><button id="minus">縮小</button><label><input type="checkbox" id="overlay" checked>写真にGTの輪を重ねる</label></div>
<main><section><div class="photo"><canvas id="photo" aria-label="写真とGT交点"></canvas></div><small>写真はドラッグで移動、ホイールで拡大。輪は盤面交点のラベルで、石上面の中心とは異なる場合があります。</small><p><a id="original" target="_blank" rel="noopener">原寸PNGを開く</a><button id="native">原寸写真で表示</button></p><small id="resolution">長辺2048以下のJPEGプレビュー。細部は原寸PNGで確認できます。</small></section>
<aside><h2>GTの配置（写真と同じ向き）</h2><svg id="board" viewBox="0 0 460 460" role="img" aria-label="GTの模式図"></svg><p id="detail">図の交点をクリックすると写真の同じ交点を拡大します。</p><p id="counts"></p><p id="source"></p><small>番号は上から行、左から列。橙の×は判別不能。留保用もGT確認だけを行い、学習・認識比較には使いません。誤りがあれば写真IDと行・列をお知らせください。</small></aside></main>
<script src="gt-review.js"></script></html>
